name: Matrix demo
on: push
jobs:
  build:
    strategy:
      matrix:
        node-versions: [12, 14, 16]
        operating-systems: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.operating-systems }}
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Install NodeJS
        uses: actions/checkout@v4
        with:
          node-version: ${{ matrix.node-versions }}
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build
